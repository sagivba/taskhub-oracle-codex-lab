<h1>TaskHub - זרימת פיתוח במעבדת Codex</h1>
<p>התרשים מדגיש שה-SQL נכתב קודם ל-Git, ורק אחר כך נשלח ל-Oracle דרך <span dir="ltr">SQLcl MCP R4</span>. אותו SQL נשאר replayable להרצה ידנית.</p>
<div class="frame"><svg viewBox="0 0 1160 600" role="img" aria-labelledby="t2 d2">
<title id="t2">TaskHub Codex lab execution flow</title><desc id="d2">Codex reads tasks and source in Git, writes numbered SQL before execution, sends SQL through SQLcl MCP R4 to the DEV schemas, runs deterministic tests, records concise evidence, and maintains a manual SQLcl replay path for rebuild and QA deployment.</desc>

<foreignObject x="50" y="107" width="190" height="90"><div xmlns="http://www.w3.org/1999/xhtml" class="small"><div class="title" dir="ltr">Git Repository</div><div dir="ltr">AGENTS.md + task + spec</div><div dir="ltr">db/src + db/changes + tests</div><div dir="rtl">Source of Truth</div></div></foreignObject>

<rect x="330" y="90" width="200" height="120" rx="8" class="box"/>
<foreignObject x="345" y="107" width="170" height="90"><div xmlns="http://www.w3.org/1999/xhtml" class="small"><div class="title" dir="ltr">Codex CLI</div><div dir="rtl">עורך source</div><div dir="rtl">יוצר SQL ממוספר</div><div dir="rtl">מריץ רק אחרי שמירה</div></div></foreignObject>

<rect x="610" y="90" width="200" height="120" rx="8" class="box mcp"/>
<foreignObject x="625" y="107" width="170" height="90"><div xmlns="http://www.w3.org/1999/xhtml" class="small"><div class="title" dir="ltr">SQLcl MCP</div><div dir="ltr">Restrict Level R4</div><div dir="ltr">run-sql</div><div dir="rtl">ללא @ / @@ דרך MCP</div></div></foreignObject>

<rect x="885" y="70" width="230" height="165" rx="8" class="box db"/>
<foreignObject x="900" y="88" width="200" height="135"><div xmlns="http://www.w3.org/1999/xhtml" class="small"><div class="title" dir="ltr">Oracle DEV Lab</div><div dir="ltr">TASKHUB_OWNER</div><div dir="ltr">TASKHUB_API</div><div dir="ltr">TASKHUB_APP</div><div dir="rtl">DDL/DML + compile + query</div></div></foreignObject>

<rect x="330" y="320" width="200" height="120" rx="8" class="box test"/>
<foreignObject x="345" y="337" width="170" height="90"><div xmlns="http://www.w3.org/1999/xhtml" class="small"><div class="title">Tests</div><div dir="rtl">Structure / Context</div><div dir="rtl">Security / Functional</div><div dir="rtl">Maintenance / Rebuild</div></div></foreignObject>

<rect x="610" y="320" width="200" height="120" rx="8" class="box test"/>
<foreignObject x="625" y="337" width="170" height="90"><div xmlns="http://www.w3.org/1999/xhtml" class="small"><div class="title">Evidence</div><div dir="rtl">תוצאות קצרות</div><div dir="ltr">USER_ERRORS / grants</div><div dir="rtl">PASS / BLOCKED</div></div></foreignObject>

<rect x="35" y="320" width="220" height="120" rx="8" class="box manual"/>
<foreignObject x="50" y="337" width="190" height="90"><div xmlns="http://www.w3.org/1999/xhtml" class="small"><div class="title" dir="ltr">Manual SQLcl Replay</div><div dir="ltr">db/deploy/install/run_all.sql</div><div dir="ltr">@@ numbered changes</div><div dir="rtl">Rebuild / QA מחוץ ל-Codex</div></div></foreignObject>
